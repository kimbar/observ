name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OBSERV_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OBSERV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/observ.jks"
            echo "OBSERV_KEYSTORE_FILE=$RUNNER_TEMP/observ.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No OBSERV_KEYSTORE_BASE64 secret: building debug APK only."
          fi

      - name: Build
        env:
          OBSERV_KEYSTORE_PASSWORD: ${{ secrets.OBSERV_KEYSTORE_PASSWORD }}
          OBSERV_KEY_ALIAS: ${{ secrets.OBSERV_KEY_ALIAS }}
          OBSERV_KEY_PASSWORD: ${{ secrets.OBSERV_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk observ.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk observ.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: observ-apk-${{ github.run_number }}
          path: observ.apk

      # Each build on the default branch replaces the "latest" release, so phones can always
      # download the newest APK from the same page.
      - name: Publish latest release
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest observ.apk \
            --title "observ build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Signed: ${{ steps.signing.outputs.signed || 'false (debug key)' }}" \
            --target "${{ github.sha }}"
